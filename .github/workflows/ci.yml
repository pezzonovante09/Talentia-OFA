name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    name: talentia-mobile (lint, typecheck, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: talentia-mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: talentia-mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test -- --ci

      - name: Check i18n keys
        run: npm run check:i18n

  proxy:
    name: talentia-ai-proxy-next (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: talentia-ai-proxy-next
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: talentia-ai-proxy-next/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          # No real accounts are wired up in CI — routes that need these
          # env vars are already designed to fail gracefully/fail-closed
          # without them (see src/lib/ratelimit.ts, src/lib/verifyAuth.ts).
          NODE_ENV: production
