name: CI

on:
  pull_request:
  push:
    # основная ветка — master; ветка пересборки — пока идёт работа на ней
    branches: [master, claude/jolly-clarke-ttbuh5]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# минимальные права токена: CI только читает репозиторий
permissions:
  contents: read

jobs:
  gate:
    name: audit gate (hooks tests, экраны и контент до чистого раунда)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # три точки в `git diff base...HEAD` и `git show base:…` нужна полная история
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Hook and gate tests
        run: npm run test:hooks

      # Ворота аудита (решение №76) хук Claude Code держит только в сессии; здесь — всё, что вошло в
      # PR или пуш любым путём. Состояние ворот берётся из базовой ветки, а не из PR.
      - name: Screens and new content only after a clean audit round
        run: node .claude/hooks/check-pr.js "${{ github.event.pull_request.base.sha || github.event.before }}" HEAD

  mobile:
    name: talentia-mobile (lint, typecheck, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: talentia-mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: talentia-mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test -- --ci

  proxy:
    name: talentia-ai-proxy-next (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: talentia-ai-proxy-next
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: talentia-ai-proxy-next/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          # No real accounts are wired up in CI — routes that need these
          # env vars are already designed to fail gracefully/fail-closed
          # without them (see src/lib/ratelimit.ts, src/lib/verifyAuth.ts).
          NODE_ENV: production

  db:
    name: supabase (migrations and RLS in PGlite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supabase
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: supabase/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Migrations and RLS
        run: npm test
